# Hushh Tunnel — Alembic Configuration
# See: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts
script_location = server/db/migrations

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for generated revision dates
timezone = UTC

# Max length of slug
truncate_slug_length = 40

# Set this to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
revision_environment = false

# Set this to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
sourceless = false

# Version locations
version_locations = %(here)s/server/db/migrations/versions

# The output encoding used when revision files are written from script.mako
output_encoding = utf-8

sqlalchemy.url = sqlite+aiosqlite:///./hushh.db

[post_write_hooks]
# This section defines scripts or Python functions that are run
# on newly generated revision scripts.
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
