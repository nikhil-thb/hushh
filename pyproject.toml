[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Server package
# ---------------------------------------------------------------------------
[project]
name = "hushh-tunnel"
version = "0.1.1"
description = "Production-ready open-source reverse tunneling platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Hushh Team", email = "dev@hushh.online" }]
keywords = ["tunnel", "ngrok", "reverse-proxy", "websocket", "devtools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Framework :: FastAPI",
]

dependencies = [

    # Client
    "typer>=0.12.3",
    "rich>=13.7.1",
    "httpx[http2]>=0.27.0",
    "websockets>=12.0",
    "structlog>=24.2.0",
    "pydantic>=2.7.0",
    # Shared
    "anyio>=4.4.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.1",
    "aiosqlite>=0.20.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.0.0",
    "slowapi>=0.1.9",
    "prometheus-client>=0.20.0",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0.1",
    "structlog>=24.2.0",
    "sendgrid>=6.11.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.8",
    "black>=24.4.2",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
    "types-passlib>=1.7.7",
]

[project.scripts]
hushh = "client.main:app"
hushh-server = "server.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["server*", "client*", "shared*"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["server", "client", "shared", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations
    "S",   # flake8-bandit
    "RUF", # ruff-specific
]
ignore = [
    "ANN101", # missing type annotation for self
    "ANN102", # missing type annotation for cls
    "S101",   # use of assert (ok in tests)
    "B008",   # do not perform function calls in argument defaults (FastAPI DI)
    "ANN401", # dynamically typed expressions (typing.Any) are disallowed
    "E501",   # line too long
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]
"alembic/**" = ["ANN", "INP001"]

# ---------------------------------------------------------------------------
# Black
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]

# ---------------------------------------------------------------------------
# MyPy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false
warn_return_any = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "terraform/"]

[[tool.mypy.overrides]]
module = ["slowapi.*", "prometheus_client.*", "passlib.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=server --cov=client --cov=shared --cov-report=term-missing -v"
filterwarnings = ["ignore::DeprecationWarning"]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["server", "client", "shared"]
omit = ["*/migrations/*", "*/alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
