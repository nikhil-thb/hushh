# IMPORTANT: Replace placeholder values with real secrets.
# Generate with: kubectl create secret generic hushh-secret \
#   --from-literal=HUSHH_SECRET_KEY=$(python -c "import secrets; print(secrets.token_hex(32))") \
#   --from-literal=HUSHH_ADMIN_EMAIL=admin@hushh.online \
#   --from-literal=HUSHH_ADMIN_PASSWORD=yourpassword \
#   -n hushh --dry-run=client -o yaml | kubectl apply -f -
#
# The values below are base64-encoded placeholders. DO NOT use in production.
apiVersion: v1
kind: Secret
metadata:
  name: hushh-secret
  namespace: hushh
type: Opaque
stringData:
  HUSHH_SECRET_KEY: "REPLACE_WITH_REAL_SECRET_KEY"
  HUSHH_ADMIN_EMAIL: "admin@hushh.online"
  HUSHH_ADMIN_PASSWORD: "REPLACE_WITH_REAL_PASSWORD"
